<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Talabat Zone Dashboard</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --orange: #FF6B00;
    --orange-light: #FF8C00;
    --orange-dark: #CC5500;
    --bg: #0d0d0d;
    --bg2: #1a1a1a;
    --bg3: #242424;
    --border: rgba(255,107,0,0.2);
    --green: #10b981;
    --red: #ef4444;
    --text: #f5f5f5;
    --text2: #a0a0a0;
  }
  body {
    font-family: 'Segoe UI', -apple-system, sans-serif;
    background: var(--bg);
    min-height: 100vh;
    color: var(--text);
  }

  /* HEADER */
  .header {
    background: linear-gradient(135deg, #1a0a00, #2d1200);
    border-bottom: 2px solid var(--orange);
    padding: 14px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 12px;
    position: sticky;
    top: 0;
    z-index: 100;
  }
  .header-left { display: flex; align-items: center; gap: 14px; }
  .talabat-logo {
    background: var(--orange);
    color: #fff;
    font-size: 11px;
    font-weight: 900;
    padding: 5px 10px;
    border-radius: 6px;
    letter-spacing: 1px;
    text-transform: uppercase;
  }
  .header-title { font-size: 18px; font-weight: 900; color: var(--text); }
  .header-sub { font-size: 11px; color: var(--text2); margin-top: 2px; }
  .refresh-btn {
    background: var(--orange);
    border: none;
    color: #fff;
    border-radius: 8px;
    padding: 8px 18px;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.2s;
  }
  .refresh-btn:hover { background: var(--orange-light); }

  /* MAIN */
  .main { padding: 20px 24px; max-width: 1200px; margin: 0 auto; }

  /* ZONE TABS */
  .zone-tabs { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
  .zone-btn {
    border-radius: 10px;
    padding: 10px 22px;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    border: 1px solid rgba(255,107,0,0.2);
    background: var(--bg2);
    color: var(--text2);
    transition: all 0.2s;
  }
  .zone-btn.active {
    background: var(--orange);
    border-color: var(--orange);
    color: #fff;
  }
  .zone-btn:hover:not(.active) { border-color: var(--orange); color: var(--text); }

  /* VIEW TABS */
  .view-tabs { display: flex; gap: 8px; margin-bottom: 20px; flex-wrap: wrap; }
  .view-btn {
    border-radius: 8px;
    padding: 7px 16px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    border: 1px solid rgba(255,255,255,0.1);
    background: var(--bg3);
    color: var(--text2);
    transition: all 0.2s;
  }
  .view-btn.active {
    background: rgba(255,107,0,0.2);
    border-color: var(--orange);
    color: var(--orange);
  }

  /* HERO */
  .zone-hero {
    background: linear-gradient(135deg, rgba(255,107,0,0.12), rgba(255,107,0,0.05));
    border: 1px solid rgba(255,107,0,0.3);
    border-radius: 14px;
    padding: 18px 24px;
    margin-bottom: 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 16px;
  }
  .zone-hero-name { font-size: 24px; font-weight: 900; color: var(--orange); }
  .zone-hero-date { color: var(--text2); font-size: 12px; margin-top: 4px; }
  .hero-stats { display: flex; gap: 28px; flex-wrap: wrap; }
  .hero-stat { text-align: center; }
  .hero-stat-val { font-size: 26px; font-weight: 900; }
  .hero-stat-label { font-size: 10px; color: var(--text2); text-transform: uppercase; letter-spacing: 1px; margin-top: 2px; }

  /* VEHICLE FILTER */
  .vehicle-tabs { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
  .vehicle-btn {
    border-radius: 8px;
    padding: 6px 14px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    border: 1px solid rgba(255,255,255,0.08);
    background: var(--bg3);
    color: var(--text2);
    transition: all 0.2s;
  }
  .vehicle-btn.active {
    background: rgba(255,107,0,0.15);
    border-color: rgba(255,107,0,0.4);
    color: var(--orange);
  }

  /* SECTION LABEL */
  .section-label {
    font-size: 11px;
    color: var(--text2);
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-bottom: 12px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .section-label::after {
    content: '';
    flex: 1;
    height: 1px;
    background: rgba(255,107,0,0.15);
  }

  /* METRICS GRID */
  .metrics-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
    gap: 10px;
    margin-bottom: 24px;
  }
  .metric-card {
    border-radius: 10px;
    padding: 14px 16px;
    display: flex;
    flex-direction: column;
    gap: 5px;
    border: 1px solid rgba(255,255,255,0.07);
    background: var(--bg2);
    transition: transform 0.15s, border-color 0.15s;
  }
  .metric-card:hover { transform: translateY(-2px); border-color: rgba(255,107,0,0.3); }
  .metric-card.positive { background: rgba(16,185,129,0.07); border-color: rgba(16,185,129,0.25); }
  .metric-card.negative { background: rgba(239,68,68,0.07); border-color: rgba(239,68,68,0.25); }
  .metric-label { font-size: 10px; color: var(--text2); font-weight: 600; text-transform: uppercase; letter-spacing: 0.8px; }
  .metric-value-row { display: flex; align-items: baseline; gap: 4px; flex-wrap: wrap; }
  .metric-value { font-size: 22px; font-weight: 800; color: var(--text); }
  .metric-delta { font-size: 11px; font-weight: 700; }
  .delta-up { color: var(--green); }
  .delta-down { color: var(--red); }
  .metric-prev { font-size: 11px; color: var(--text2); }

  /* WEEKLY */
  .weekly-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
    gap: 8px;
    margin-bottom: 24px;
  }
  .weekly-card {
    background: rgba(255,107,0,0.07);
    border: 1px solid rgba(255,107,0,0.2);
    border-radius: 10px;
    padding: 12px 14px;
  }
  .weekly-label { font-size: 10px; color: var(--orange); font-weight: 600; text-transform: uppercase; letter-spacing: 0.8px; margin-bottom: 4px; }
  .weekly-value { font-size: 18px; font-weight: 800; color: var(--text); }

  /* HISTORY TABLE */
  .history-table-wrap { overflow-x: auto; margin-bottom: 24px; border-radius: 10px; border: 1px solid rgba(255,107,0,0.15); }
  .history-table { width: 100%; border-collapse: collapse; font-size: 12px; }
  .history-table th {
    background: rgba(255,107,0,0.15);
    color: var(--orange);
    padding: 10px 12px;
    text-align: center;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    white-space: nowrap;
    position: sticky;
    top: 0;
  }
  .history-table td {
    padding: 8px 12px;
    text-align: center;
    border-bottom: 1px solid rgba(255,255,255,0.04);
    white-space: nowrap;
    color: var(--text);
  }
  .history-table tr:hover td { background: rgba(255,107,0,0.05); }
  .history-table tr:last-child td { border-bottom: none; }
  .history-table td:first-child { color: var(--text2); font-size: 11px; text-align: left; }
  .td-good { color: var(--green) !important; font-weight: 700; }
  .td-bad { color: var(--red) !important; font-weight: 700; }

  /* ERROR / LOADING */
  .error-box {
    background: rgba(239,68,68,0.08);
    border: 1px solid rgba(239,68,68,0.25);
    border-radius: 10px;
    padding: 16px;
    color: #fca5a5;
    margin-bottom: 20px;
    font-size: 14px;
  }
  .loading { text-align: center; padding: 60px; color: var(--text2); font-size: 15px; }

  /* FOOTER */
  .footer { text-align: center; margin-top: 40px; color: #444; font-size: 11px; padding-bottom: 30px; }

  @media (max-width: 600px) {
    .main { padding: 12px; }
    .metrics-grid { grid-template-columns: repeat(2, 1fr); }
    .zone-hero-name { font-size: 18px; }
    .hero-stat-val { font-size: 20px; }
  }
</style>
</head>
<body>

<div class="header">
  <div class="header-left">
    <div class="talabat-logo">talabat</div>
    <div>
      <div class="header-title">Ups and Downs Dashboard</div>
      <div id="header-zone" style="font-size:13px;color:var(--orange);font-weight:700;margin-top:2px;">Cairo City Centre</div>
      <div class="header-sub" id="last-updated">Loading...</div>
    </div>
  </div>
  <button class="refresh-btn" onclick="loadData()" id="refresh-btn">🔄 Refresh</button>
</div>

<div class="main">
  <div class="zone-tabs" id="zone-tabs"></div>
  <div id="content"></div>
  <div class="footer">Talabat Zone Dashboard by Mahmoud Younis • Auto-synced from Google Sheets</div>
</div>

<script>
const DATA_URL = "https://raw.githubusercontent.com/ma3297211-lang/Zone-dashboar/main/data.json";

const ZONES = [
  { id: "CCC",     label: "Cairo City Centre", emoji: "🏙️", key: "CCC" },
  { id: "Giza",    label: "Giza",              emoji: "🏛️", key: "Giza" },
  { id: "Hadayek", label: "Hadayek el Ahram",  emoji: "🌿", key: "Hadayek el ahram" },
];

const ZONE_METRICS = [
  { label:"Orders",          col:8,  pct:false, up:true  },
  { label:"WH",              col:9,  pct:false, up:true  },
  { label:"UTR",             col:10, pct:false, up:true  },
  { label:"Fail Rate %",     col:11, pct:true,  up:false },
  { label:"TR Fail",         col:12, pct:true,  up:false },
  { label:"DT",              col:13, pct:false, up:false },
  { label:"RAT",             col:14, pct:false, up:false },
  { label:"AR %",            col:15, pct:true,  up:true  },
  { label:"Order On Time %", col:16, pct:true,  up:true  },
  { label:"Idle Time %",     col:17, pct:true,  up:false },
  { label:"Breaks %",        col:18, pct:true,  up:false },
  { label:"Active Riders",   col:19, pct:false, up:true  },
  { label:"No Show %",       col:20, pct:true,  up:false },
  { label:"AVP %",           col:21, pct:true,  up:true  },
  { label:"AVG WH/Rider",    col:22, pct:false, up:true  },
  { label:"Fill Rate %",     col:23, pct:true,  up:true  },
  { label:"Late Login %",    col:24, pct:true,  up:false },
];

const WEEKLY_METRICS = [
  { label:"Run Rate",     col:1,  pct:true  },
  { label:"Lost Orders",  col:2,  pct:false },
  { label:"Orders",       col:3,  pct:false },
  { label:"UTR",          col:5,  pct:false },
  { label:"Fail Rate",    col:6,  pct:true  },
  { label:"On Time",      col:10, pct:true  },
  { label:"No Show",      col:8,  pct:true  },
  { label:"Fill Rate",    col:13, pct:true  },
];

const VEH_METRICS = [
  { label:"Orders",       col:4,  pct:false, up:true  },
  { label:"UTR",          col:5,  pct:false, up:true  },
  { label:"DT",           col:6,  pct:false, up:false },
  { label:"WH",           col:7,  pct:false, up:true  },
  { label:"RAT",          col:8,  pct:false, up:false },
  { label:"AR %",         col:9,  pct:true,  up:true  },
  { label:"On Time %",    col:10, pct:true,  up:true  },
  { label:"Idle Time %",  col:11, pct:true,  up:false },
  { label:"No Show %",    col:13, pct:true,  up:false },
  { label:"Fill Rate %",  col:14, pct:true,  up:true  },
];

// History table columns
const HISTORY_COLS = [
  { label:"Date",         col:4,  pct:false },
  { label:"Orders",       col:8,  pct:false },
  { label:"UTR",          col:10, pct:false },
  { label:"Run Rate",     col:7,  pct:true  },
  { label:"Lost Orders",  col:6,  pct:false },
  { label:"Fail Rate",    col:11, pct:true  },
  { label:"On Time",      col:16, pct:true  },
  { label:"No Show",      col:20, pct:true  },
  { label:"Active",       col:19, pct:false },
  { label:"Fill Rate",    col:23, pct:true  },
];

let state = { zone: "CCC", vehicle: "all", view: "today", rawData: null };

function parseNum(v) {
  if (!v && v !== 0) return null;
  if (v === "" || v === "#DIV/0!") return null;
  let s = String(v).replace(/,/g,"").replace(/%/g,"").trim();
  const n = parseFloat(s);
  return isNaN(n) ? null : n;
}

function fmt(v, pct) {
  if (v === null || v === undefined) return "—";
  if (pct && v > 0 && v <= 1) v = v * 100;
  if (pct) return v.toFixed(1) + "%";
  if (v >= 1000) return (v/1000).toFixed(1) + "k";
  return v % 1 === 0 ? v.toFixed(0) : v.toFixed(2);
}

function fmtDate(d) {
  if (!d) return "—";
  const s = String(d);
  if (s.includes("T")) {
    try {
      const dt = new Date(s);
      return dt.toLocaleDateString("en-GB", {weekday:"short", day:"numeric", month:"short"});
    } catch(e) { return s; }
  }
  return s;
}

function deltaHTML(curr, prev, up, pct) {
  if (curr === null || prev === null) return "";
  // Normalize percentages stored as decimals
  let c = curr, p = prev;
  if (pct && c > 0 && c <= 1) c = c * 100;
  if (pct && p > 0 && p <= 1) p = p * 100;
  const diff = c - p;
  if (Math.abs(diff) < 0.001) return `<span class="metric-delta" style="color:#666">→0</span>`;
  const positive = up ? diff > 0 : diff < 0;
  const cls = positive ? "delta-up" : "delta-down";
  const arrow = diff > 0 ? "▲" : "▼";
  // Show enough decimal places to be meaningful
  const absDiff = Math.abs(diff);
  const formatted = absDiff >= 100 ? absDiff.toFixed(0) : absDiff >= 10 ? absDiff.toFixed(1) : absDiff.toFixed(2);
  return `<span class="metric-delta ${cls}">${arrow}${formatted}${pct?"%":""}</span>`;
}

function metricCardHTML(label, curr, prev, up, pct) {
  const c = parseNum(curr), p = parseNum(prev);
  const positive = (c!==null && p!==null) ? (up ? c>=p : c<=p) : null;
  const cls = positive===null ? "" : positive ? "positive" : "negative";
  return `
    <div class="metric-card ${cls}">
      <div class="metric-label">${label}</div>
      <div class="metric-value-row">
        <span class="metric-value">${fmt(c,pct)}</span>
        ${deltaHTML(c,p,up,pct)}
      </div>
      ${p!==null ? `<div class="metric-prev">Yesterday: ${fmt(p,pct)}</div>` : ""}
    </div>`;
}

async function loadData() {
  document.getElementById("refresh-btn").textContent = "⏳ Loading...";
  document.getElementById("content").innerHTML = `<div class="loading">⏳ Loading data...</div>`;
  try {
    const r = await fetch(DATA_URL + "?t=" + Date.now());
    if (!r.ok) throw new Error("Failed to load data");
    state.rawData = await r.json();
    document.getElementById("last-updated").textContent = "Updated: " + new Date().toLocaleTimeString("en-GB");
  } catch(e) {
    document.getElementById("content").innerHTML = `<div class="error-box">❌ ${e.message}</div>`;
  }
  document.getElementById("refresh-btn").textContent = "🔄 Refresh";
  render();
}

function getSheetData(zoneId) {
  const zone = ZONES.find(z => z.id === zoneId);
  // Try exact key first, then search all keys case-insensitively
  if (state.rawData[zone.key]) return state.rawData[zone.key];
  const keys = Object.keys(state.rawData);
  const match = keys.find(k => k.toLowerCase().replace(/_/g," ").includes(zone.key.toLowerCase().split(" ")[0]));
  return match ? state.rawData[match] : [];
}

function getZoneRows() {
  const all = getSheetData(state.zone);
  return all.filter(r => r[1] && r[4] && String(r[0]) !== "Week" && String(r[0]) !== "ek" && String(r[0]) !== "WK" && parseNum(r[8]) > 0);
}

function getWeeklyRows() {
  const all = getSheetData(state.zone);
  const wIdx = all.findIndex(r => String(r[1]).toLowerCase() === "week");
  if (wIdx === -1) return [];
  return all.slice(wIdx+1).filter(r => parseNum(r[0]) > 0);
}

function render() {
  // Zone tabs
  document.getElementById("zone-tabs").innerHTML = ZONES.map(z =>
    `<button class="zone-btn ${state.zone===z.id?'active':''}" onclick="setZone('${z.id}')">${z.emoji} ${z.label}</button>`
  ).join("");

  // Update zone name in header
  document.getElementById("header-zone").textContent = zone.label;

  if (!state.rawData) return;

  const validRows = getZoneRows();
  const today = validRows[validRows.length - 1];
  const yesterday = validRows[validRows.length - 2];
  const weeklyRows = getWeeklyRows();
  const latestWeek = weeklyRows[weeklyRows.length - 1];

  // Vehicle data
  const vehicleRows = state.rawData["Vehicle Type Daily and Weekly"] || [];
  const zKey = state.zone === "CCC" ? "cairo" : state.zone === "Giza" ? "giza" : "hadayek";
  const zVehicle = vehicleRows.filter(r => r[1] && r[1].toLowerCase().replace(/_/g," ").includes(zKey));
  const validV = zVehicle.filter(r => parseNum(r[4]) > 0);
  const vDates = [...new Set(validV.map(r => r[2]))];
  const todayV = validV.filter(r => r[2] === vDates[vDates.length-1]);
  const yesterV = validV.filter(r => r[2] === vDates[vDates.length-2]);

  if (!today) {
    document.getElementById("content").innerHTML = `<div class="loading">No data available</div>`;
    return;
  }

  // Hero stats
  const rr = parseNum(today[7]);
  const rrPct = rr !== null && rr <= 1 ? rr * 100 : rr;
  const rrColor = rrPct >= 90 ? "var(--green)" : rrPct >= 80 ? "#f59e0b" : "var(--red)";
  const lo = parseNum(today[6]);
  const loColor = lo <= 300 ? "var(--green)" : lo <= 600 ? "#f59e0b" : "var(--red)";

  // WH Target (col 26 based on sheet), Zone Target (col 3), UTR from weekly last row right side
  const whTarget = parseNum(today[26]) || parseNum(today[25]) || "—";
  const zoneTarget = parseNum(today[3]);
  const utrVal = parseNum(today[10]);

  const hero = `
    <div class="zone-hero">
      <div>
        <div class="zone-hero-name">${zone.emoji} ${zone.label}</div>
        <div class="zone-hero-date">📅 ${fmtDate(today[4])} &nbsp;|&nbsp; Week ${today[0]||"—"}</div>
      </div>
      <div class="hero-stats">
        <div class="hero-stat">
          <div class="hero-stat-val" style="color:var(--orange)">${fmt(whTarget, false)}</div>
          <div class="hero-stat-label">WH Target</div>
        </div>
        <div class="hero-stat">
          <div class="hero-stat-val" style="color:${zoneTarget !== null && zoneTarget >= 0.9 ? 'var(--green)' : 'var(--red)'}">${fmt(zoneTarget !== null && zoneTarget <= 1 ? zoneTarget * 100 : zoneTarget, false)}%</div>
          <div class="hero-stat-label">Zone Target %</div>
        </div>
        <div class="hero-stat">
          <div class="hero-stat-val" style="color:var(--orange)">${fmt(utrVal, false)}</div>
          <div class="hero-stat-label">UTR</div>
        </div>
      </div>
    </div>`;

  // View tabs
  const viewTabs = `
    <div class="view-tabs">
      <button class="view-btn ${state.view==='today'?'active':''}" onclick="setView('today')">📊 Today vs Yesterday</button>
      <button class="view-btn ${state.view==='weekly'?'active':''}" onclick="setView('weekly')">📅 Weekly Summary</button>
      <button class="view-btn ${state.view==='history'?'active':''}" onclick="setView('history')">📆 Monthly History</button>
    </div>`;

  // Vehicle tabs
  const vehicleTabs = `
    <div class="vehicle-tabs">
      <button class="vehicle-btn ${state.vehicle==='all'?'active':''}" onclick="setVehicle('all')">📊 All</button>
      <button class="vehicle-btn ${state.vehicle==='Bike'?'active':''}" onclick="setVehicle('Bike')">🏍️ Bike</button>
      <button class="vehicle-btn ${state.vehicle==='Bicycle'?'active':''}" onclick="setVehicle('Bicycle')">🚲 Bicycle</button>
    </div>`;

  let mainContent = "";

  if (state.view === "today") {
    if (state.vehicle === "all") {
      const metricsGrid = ZONE_METRICS.map(m =>
        metricCardHTML(m.label, today[m.col], yesterday?.[m.col], m.up, m.pct)
      ).join("");
      mainContent = `
        <div class="section-label">📊 Today vs Yesterday</div>
        ${vehicleTabs}
        <div class="metrics-grid">${metricsGrid}</div>`;
    } else {
      const todayRow = todayV.find(r => r[3] === state.vehicle);
      const yesterRow = yesterV.find(r => r[3] === state.vehicle);
      const vIcon = state.vehicle === "Bike" ? "🏍️" : "🚲";
      const vCards = VEH_METRICS.map(m =>
        metricCardHTML(m.label, todayRow?.[m.col], yesterRow?.[m.col], m.up, m.pct)
      ).join("");
      mainContent = `
        <div class="section-label">${vIcon} ${state.vehicle} — Today vs Yesterday</div>
        ${vehicleTabs}
        <div class="metrics-grid">${vCards}</div>`;
    }

  } else if (state.view === "weekly") {
    if (!latestWeek) {
      mainContent = `<div class="loading">No weekly data</div>`;
    } else {
      const weekCards = WEEKLY_METRICS.map(m => `
        <div class="weekly-card">
          <div class="weekly-label">${m.label}</div>
          <div class="weekly-value">${fmt(parseNum(latestWeek[m.col]), m.pct)}</div>
        </div>`).join("");
      mainContent = `
        <div class="section-label">📅 Week ${latestWeek[0]} Summary</div>
        <div class="weekly-grid">${weekCards}</div>`;
    }

  } else if (state.view === "history") {
    // All days this month
    const rows = validRows.slice().reverse(); // newest first
    const tableRows = rows.map(r => {
      const rr = parseNum(r[7]);
      const rrPct = rr !== null && rr <= 1 ? rr * 100 : rr;
      const rrGood = rrPct >= 90;
      return `<tr>
        <td>${fmtDate(r[4])}</td>
        <td>${fmt(parseNum(r[8]), false)}</td>
        <td>${fmt(parseNum(r[10]), false)}</td>
        <td class="${rrGood?'td-good':'td-bad'}">${fmt(rrPct, false)}%</td>
        <td class="${parseNum(r[6])<=300?'td-good':'td-bad'}">${fmt(parseNum(r[6]), false)}</td>
        <td class="${parseNum(r[11])<=0.03?'td-good':'td-bad'}">${fmt(parseNum(r[11]), true)}</td>
        <td class="${parseNum(r[16])>=0.95?'td-good':'td-bad'}">${fmt(parseNum(r[16]), true)}</td>
        <td class="${parseNum(r[20])<=0.05?'td-good':'td-bad'}">${fmt(parseNum(r[20]), true)}</td>
        <td>${fmt(parseNum(r[19]), false)}</td>
        <td class="${parseNum(r[23])>=0.8?'td-good':'td-bad'}">${fmt(parseNum(r[23]), true)}</td>
      </tr>`;
    }).join("");

    mainContent = `
      <div class="section-label">📆 Monthly History — All Days</div>
      <div class="history-table-wrap">
        <table class="history-table">
          <thead><tr>
            <th>Date</th><th>Orders</th><th>UTR</th><th>Run Rate</th>
            <th>Lost Orders</th><th>Fail Rate</th><th>On Time</th>
            <th>No Show</th><th>Active</th><th>Fill Rate</th>
          </tr></thead>
          <tbody>${tableRows}</tbody>
        </table>
      </div>`;
  }

  document.getElementById("content").innerHTML = hero + viewTabs + mainContent;
}

function setZone(id) { state.zone = id; state.vehicle = "all"; render(); }
function setVehicle(v) { state.vehicle = v; render(); }
function setView(v) { state.view = v; state.vehicle = "all"; render(); }

loadData();
</script>
</body>
</html>
