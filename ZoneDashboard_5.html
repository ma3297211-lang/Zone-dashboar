<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zone Dashboard</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Segoe UI', -apple-system, sans-serif;
    background: linear-gradient(135deg, #0f0f1a 0%, #1a1a2e 50%, #0f1629 100%);
    min-height: 100vh;
    color: #f9fafb;
  }
  .header {
    background: rgba(255,255,255,0.03);
    border-bottom: 1px solid rgba(255,255,255,0.08);
    padding: 16px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 12px;
    position: sticky;
    top: 0;
    z-index: 100;
    backdrop-filter: blur(10px);
  }
  .header-title { font-size: 20px; font-weight: 900; letter-spacing: -0.5px; }
  .header-sub { font-size: 12px; color: #6b7280; margin-top: 2px; }
  .refresh-btn {
    background: rgba(99,102,241,0.2);
    border: 1px solid rgba(99,102,241,0.4);
    color: #a5b4fc;
    border-radius: 8px;
    padding: 8px 16px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
  }
  .refresh-btn:hover { background: rgba(99,102,241,0.35); }
  .main { padding: 20px 24px; max-width: 1100px; margin: 0 auto; }
  .zone-tabs { display: flex; gap: 10px; margin-bottom: 24px; flex-wrap: wrap; }
  .zone-btn {
    border-radius: 12px;
    padding: 10px 20px;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    border: 1px solid rgba(255,255,255,0.1);
    background: rgba(255,255,255,0.05);
    color: #9ca3af;
    transition: all 0.2s;
  }
  .zone-btn.active {
    background: linear-gradient(135deg, #6366f1, #8b5cf6);
    border-color: #6366f1;
    color: #fff;
  }
  .zone-hero {
    background: linear-gradient(135deg, rgba(99,102,241,0.15), rgba(139,92,246,0.1));
    border: 1px solid rgba(99,102,241,0.25);
    border-radius: 16px;
    padding: 20px 24px;
    margin-bottom: 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 16px;
  }
  .zone-hero-name { font-size: 26px; font-weight: 900; }
  .zone-hero-date { color: #9ca3af; font-size: 13px; margin-top: 4px; }
  .zone-hero-stats { display: flex; gap: 24px; flex-wrap: wrap; }
  .hero-stat { text-align: center; }
  .hero-stat-val { font-size: 28px; font-weight: 900; }
  .hero-stat-label { font-size: 10px; color: #6b7280; text-transform: uppercase; letter-spacing: 1px; margin-top: 2px; }
  .vehicle-tabs { display: flex; gap: 8px; margin-bottom: 20px; flex-wrap: wrap; }
  .vehicle-btn {
    border-radius: 8px;
    padding: 6px 14px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    border: 1px solid rgba(255,255,255,0.08);
    background: rgba(255,255,255,0.03);
    color: #6b7280;
    transition: all 0.2s;
  }
  .vehicle-btn.active {
    background: rgba(99,102,241,0.25);
    border-color: rgba(99,102,241,0.5);
    color: #a5b4fc;
  }
  .section-label {
    font-size: 12px;
    color: #6b7280;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-bottom: 12px;
  }
  .metrics-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(155px, 1fr));
    gap: 10px;
    margin-bottom: 28px;
  }
  .metric-card {
    border-radius: 12px;
    padding: 14px 16px;
    display: flex;
    flex-direction: column;
    gap: 6px;
    border: 1px solid rgba(255,255,255,0.1);
    background: rgba(255,255,255,0.04);
    transition: transform 0.15s;
  }
  .metric-card:hover { transform: translateY(-2px); }
  .metric-card.positive { background: rgba(16,185,129,0.08); border-color: rgba(16,185,129,0.3); }
  .metric-card.negative { background: rgba(239,68,68,0.08); border-color: rgba(239,68,68,0.3); }
  .metric-label { font-size: 10px; color: #9ca3af; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; }
  .metric-value-row { display: flex; align-items: baseline; gap: 4px; flex-wrap: wrap; }
  .metric-value { font-size: 22px; font-weight: 800; color: #f9fafb; }
  .metric-delta { font-size: 12px; font-weight: 700; }
  .delta-up { color: #10b981; }
  .delta-down { color: #ef4444; }
  .metric-prev { font-size: 11px; color: #6b7280; }
  .weekly-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
    gap: 8px;
    margin-bottom: 28px;
  }
  .weekly-card {
    background: rgba(99,102,241,0.1);
    border: 1px solid rgba(99,102,241,0.25);
    border-radius: 10px;
    padding: 12px 14px;
  }
  .weekly-label { font-size: 10px; color: #a5b4fc; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 4px; }
  .weekly-value { font-size: 18px; font-weight: 800; color: #f9fafb; }
  .error-box {
    background: rgba(239,68,68,0.1);
    border: 1px solid rgba(239,68,68,0.3);
    border-radius: 12px;
    padding: 16px;
    color: #fca5a5;
    margin-bottom: 20px;
    font-size: 14px;
  }
  .loading { text-align: center; padding: 60px; color: #6b7280; font-size: 16px; }
  .footer { text-align: center; margin-top: 40px; color: #374151; font-size: 12px; padding-bottom: 30px; }
  @media (max-width: 600px) {
    .main { padding: 16px; }
    .metrics-grid { grid-template-columns: repeat(2, 1fr); }
    .zone-hero-name { font-size: 20px; }
  }
</style>
</head>
<body>

<div class="header">
  <div>
    <div class="header-title">⚡ Zone Dashboard</div>
    <div class="header-sub" id="last-updated">جاري التحميل...</div>
  </div>
  <button class="refresh-btn" onclick="loadData()" id="refresh-btn">🔄 Refresh</button>
</div>

<div class="main">
  <div class="zone-tabs" id="zone-tabs"></div>
  <div id="content"></div>
  <div class="footer">Zone Dashboard by Mahmoud Younis • بيتحدث من Google Sheets</div>
</div>

<script>
const DATA_URL = "https://raw.githubusercontent.com/ma3297211-lang/Zone-dashboar/main/data.json";

const ZONES = [
  { id: "CCC",     label: "Cairo City Centre", emoji: "🏙️", key: "CCC" },
  { id: "Giza",    label: "Giza",              emoji: "🏛️", key: "Giza" },
  { id: "Hadayek", label: "Hadayek el Ahram",  emoji: "🌿", key: "Hadayek el ahram" },

];

const ZONE_METRICS = [
  { label:"Orders",           col:8,  pct:false, up:true  },
  { label:"WH",               col:9,  pct:false, up:true  },
  { label:"UTR",              col:10, pct:false, up:true  },
  { label:"Fail Rate %",      col:11, pct:true,  up:false },
  { label:"TR Fail",          col:12, pct:false, up:false },
  { label:"DT",               col:13, pct:false, up:false },
  { label:"RAT",              col:14, pct:false, up:false },
  { label:"AR %",             col:15, pct:true,  up:true  },
  { label:"Order On Time %",  col:16, pct:true,  up:true  },
  { label:"Idle Time %",      col:17, pct:true,  up:false },
  { label:"Breaks %",         col:18, pct:true,  up:false },
  { label:"Active Riders",    col:19, pct:false, up:true  },
  { label:"No Show %",        col:20, pct:true,  up:false },
  { label:"AVP %",            col:21, pct:true,  up:true  },
  { label:"AVG WH per Rider", col:22, pct:false, up:true  },
  { label:"Fill Rate %",      col:23, pct:true,  up:true  },
  { label:"Late Login",       col:24, pct:false, up:false },
];

const WEEKLY_METRICS = [
  { label:"Run Rate",      col:1,  pct:true  },
  { label:"Lost Orders",   col:2,  pct:false },
  { label:"Orders",        col:3,  pct:false },
  { label:"UTR",           col:5,  pct:false },
  { label:"Fail Rate",     col:6,  pct:true  },
  { label:"On Time",       col:10, pct:true  },
  { label:"No Show",       col:8,  pct:true  },
  { label:"Fill Rate",     col:13, pct:true  },
];

const VEH_METRICS = [
  { label:"Orders",        col:4,  pct:false, up:true  },
  { label:"UTR",           col:5,  pct:false, up:true  },
  { label:"DT",            col:6,  pct:false, up:false },
  { label:"WH",            col:7,  pct:false, up:true  },
  { label:"RAT",           col:8,  pct:false, up:false },
  { label:"AR %",          col:9,  pct:true,  up:true  },
  { label:"On Time %",     col:10, pct:true,  up:true  },
  { label:"Idle Time %",   col:11, pct:true,  up:false },
  { label:"No Show %",     col:13, pct:true,  up:false },
  { label:"Fill Rate %",   col:14, pct:true,  up:true  },
];

let state = { zone: "CCC", vehicle: "all", rawData: null };

function parseNum(v) {
  if (!v || v === "" || v === "#DIV/0!") return null;
  let s = String(v).replace(/,/g,"");
  const isPct = s.includes("%");
  s = s.replace(/%/g,"");
  const n = parseFloat(s);
  if (isNaN(n)) return null;
  // If value is percentage stored as decimal (e.g. 0.95 instead of 95%)
  if (isPct) return n;
  return n;
}

function fmt(v, pct) {
  if (v === null || v === undefined) return "—";
  // If pct and value is between 0 and 1, multiply by 100
  if (pct && v > 0 && v <= 1) v = v * 100;
  if (pct) return v.toFixed(1) + "%";
  return v >= 1000 ? (v/1000).toFixed(1)+"k" : v % 1 === 0 ? v.toFixed(0) : v.toFixed(2);
}

function fmtDate(d) {
  if (!d) return "—";
  const s = String(d);
  // Handle ISO date format
  if (s.includes("T")) {
    const date = new Date(s);
    return date.toLocaleDateString("en-GB", {weekday:"short", day:"numeric", month:"short", year:"numeric"});
  }
  return s;
}

function deltaHTML(curr, prev, up, pct) {
  if (curr === null || prev === null) return "";
  const diff = curr - prev;
  if (Math.abs(diff) < 0.01) return "";
  const positive = up ? diff > 0 : diff < 0;
  const cls = positive ? "delta-up" : "delta-down";
  const arrow = diff > 0 ? "▲" : "▼";
  return `<span class="metric-delta ${cls}">${arrow}${Math.abs(diff).toFixed(1)}${pct?"%":""}</span>`;
}

function metricCardHTML(label, curr, prev, up, pct) {
  const c = parseNum(curr), p = parseNum(prev);
  const positive = (c!==null && p!==null) ? (up ? c>=p : c<=p) : null;
  const cls = positive===null ? "" : positive ? "positive" : "negative";
  return `
    <div class="metric-card ${cls}">
      <div class="metric-label">${label}</div>
      <div class="metric-value-row">
        <span class="metric-value">${fmt(c,pct)}</span>
        ${deltaHTML(c,p,up,pct)}
      </div>
      ${p!==null ? `<div class="metric-prev">أمس: ${fmt(p,pct)}</div>` : ""}
    </div>`;
}

async function loadData() {
  document.getElementById("refresh-btn").textContent = "⏳ جاري التحميل...";
  document.getElementById("content").innerHTML = `<div class="loading">⏳<br><br>جاري تحميل البيانات...</div>`;
  
  try {
    const r = await fetch(DATA_URL + "?t=" + Date.now());
    if (!r.ok) throw new Error("تعذر تحميل البيانات");
    state.rawData = await r.json();
    document.getElementById("last-updated").textContent = "آخر تحديث: " + new Date().toLocaleTimeString("ar-EG");
  } catch(e) {
    document.getElementById("content").innerHTML = `<div class="error-box">❌ ${e.message}</div>`;
  }
  
  document.getElementById("refresh-btn").textContent = "🔄 Refresh";
  render();
}

function render() {
  document.getElementById("zone-tabs").innerHTML = ZONES.map(z =>
    `<button class="zone-btn ${state.zone===z.id?'active':''}" onclick="setZone('${z.id}')">${z.emoji} ${z.label}</button>`
  ).join("");

  if (!state.rawData) return;

  const zone = ZONES.find(z => z.id === state.zone);
  const zoneRows = state.rawData[zone.key] || [];
  const vehicleRows = state.rawData["Vehicle Type Daily and Weekly"] || [];

  // Filter valid rows
  const valid = zoneRows.filter(r => r[1] && r[4] && r[0] !== "Week" && r[0] !== "ek" && parseNum(r[8]) > 0);
  const today = valid[valid.length - 1];
  const yesterday = valid[valid.length - 2];

  // Weekly
  const wIdx = zoneRows.findIndex(r => String(r[1]).toLowerCase() === "week");
  let latestWeek = null;
  if (wIdx !== -1) {
    const wRows = zoneRows.slice(wIdx+1).filter(r => parseNum(r[0]) > 0);
    if (wRows.length) latestWeek = wRows[wRows.length-1];
  }

  // Vehicle
  const zKey = zone.id === "CCC" ? "cairo" : zone.id === "Giza" ? "giza" : "hadayek";
  const zVehicle = vehicleRows.filter(r => r[1] && r[1].toLowerCase().replace(/_/g," ").includes(zKey));
  const validV = zVehicle.filter(r => parseNum(r[4]) > 0);
  const dates = [...new Set(validV.map(r => r[2]))];
  const todayV = validV.filter(r => r[2] === dates[dates.length-1]);
  const yesterV = validV.filter(r => r[2] === dates[dates.length-2]);

  if (!today) {
    document.getElementById("content").innerHTML = `<div class="loading">لا توجد بيانات</div>`;
    return;
  }

  const rr = parseNum(today[7]);
  const rrColor = rr >= 90 ? "#10b981" : rr >= 80 ? "#f59e0b" : "#ef4444";
  const lo = parseNum(today[6]);
  const loColor = lo <= 300 ? "#10b981" : lo <= 600 ? "#f59e0b" : "#ef4444";

  const hero = `
    <div class="zone-hero">
      <div>
        <div class="zone-hero-name">${zone.emoji} ${zone.label}</div>
        <div class="zone-hero-date">📅 ${fmtDate(today[4])} &nbsp;|&nbsp; Week ${today[0]||"—"}</div>
      </div>
      <div class="zone-hero-stats">
        <div class="hero-stat">
          <div class="hero-stat-val" style="color:${rrColor}">${fmt(rr,true)}</div>
          <div class="hero-stat-label">Run Rate</div>
        </div>
        <div class="hero-stat">
          <div class="hero-stat-val" style="color:${loColor}">${fmt(lo,false)}</div>
          <div class="hero-stat-label">Lost Orders</div>
        </div>
        <div class="hero-stat">
          <div class="hero-stat-val" style="color:#6366f1">${fmt(parseNum(today[8]),false)}</div>
          <div class="hero-stat-label">Orders</div>
        </div>
      </div>
    </div>`;

  const vehicleTabs = `
    <div class="vehicle-tabs">
      <button class="vehicle-btn ${state.vehicle==='all'?'active':''}" onclick="setVehicle('all')">📊 All</button>
      <button class="vehicle-btn ${state.vehicle==='Bike'?'active':''}" onclick="setVehicle('Bike')">🏍️ Bike</button>
      <button class="vehicle-btn ${state.vehicle==='Bicycle'?'active':''}" onclick="setVehicle('Bicycle')">🚲 Bicycle</button>
    </div>`;

  let mainContent = "";

  if (state.vehicle === "all") {
    const metricsGrid = ZONE_METRICS.map(m =>
      metricCardHTML(m.label, today[m.col], yesterday?.[m.col], m.up, m.pct)
    ).join("");

    let weeklySection = "";
    if (latestWeek) {
      const weekCards = WEEKLY_METRICS.map(m => `
        <div class="weekly-card">
          <div class="weekly-label">${m.label}</div>
          <div class="weekly-value">${fmt(parseNum(latestWeek[m.col]),m.pct)}</div>
        </div>`).join("");
      weeklySection = `
        <div class="section-label">📅 الأسبوع — Week ${latestWeek[0]}</div>
        <div class="weekly-grid">${weekCards}</div>`;
    }

    mainContent = `
      <div class="section-label">📊 اليوم مقارنة بالأمس</div>
      <div class="metrics-grid">${metricsGrid}</div>
      ${weeklySection}`;
  } else {
    const todayRow = todayV.find(r => r[3] === state.vehicle);
    const yesterRow = yesterV.find(r => r[3] === state.vehicle);
    const vIcon = state.vehicle === "Bike" ? "🏍️" : "🚲";
    const vCards = VEH_METRICS.map(m =>
      metricCardHTML(m.label, todayRow?.[m.col], yesterRow?.[m.col], m.up, m.pct)
    ).join("");
    mainContent = `
      <div class="section-label">${vIcon} ${state.vehicle} — اليوم مقارنة بالأمس</div>
      <div class="metrics-grid">${vCards}</div>`;
  }

  document.getElementById("content").innerHTML = hero + vehicleTabs + mainContent;
}

function setZone(id) { state.zone = id; state.vehicle = "all"; render(); }
function setVehicle(v) { state.vehicle = v; render(); }

loadData();
</script>
</body>
</html>
