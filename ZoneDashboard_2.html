<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zone Dashboard</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Segoe UI', -apple-system, sans-serif;
    background: linear-gradient(135deg, #0f0f1a 0%, #1a1a2e 50%, #0f1629 100%);
    min-height: 100vh;
    color: #f9fafb;
  }

  /* HEADER */
  .header {
    background: rgba(255,255,255,0.03);
    border-bottom: 1px solid rgba(255,255,255,0.08);
    padding: 16px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 12px;
    position: sticky;
    top: 0;
    z-index: 100;
    backdrop-filter: blur(10px);
  }

  .header-title { font-size: 20px; font-weight: 900; letter-spacing: -0.5px; }
  .header-sub { font-size: 12px; color: #6b7280; margin-top: 2px; }

  .refresh-btn {
    background: rgba(99,102,241,0.2);
    border: 1px solid rgba(99,102,241,0.4);
    color: #a5b4fc;
    border-radius: 8px;
    padding: 8px 16px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .refresh-btn:hover { background: rgba(99,102,241,0.35); }
  .refresh-btn:disabled { opacity: 0.5; cursor: not-allowed; }

  /* MAIN */
  .main { padding: 20px 24px; max-width: 1100px; margin: 0 auto; }

  /* ZONE TABS */
  .zone-tabs { display: flex; gap: 10px; margin-bottom: 24px; flex-wrap: wrap; }

  .zone-btn {
    border-radius: 12px;
    padding: 10px 20px;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    border: 1px solid rgba(255,255,255,0.1);
    background: rgba(255,255,255,0.05);
    color: #9ca3af;
    transition: all 0.2s;
  }
  .zone-btn.active {
    background: linear-gradient(135deg, #6366f1, #8b5cf6);
    border-color: #6366f1;
    color: #fff;
  }
  .zone-btn:hover:not(.active) { background: rgba(255,255,255,0.1); color: #d1d5db; }

  /* ZONE HERO */
  .zone-hero {
    background: linear-gradient(135deg, rgba(99,102,241,0.15), rgba(139,92,246,0.1));
    border: 1px solid rgba(99,102,241,0.25);
    border-radius: 16px;
    padding: 20px 24px;
    margin-bottom: 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 16px;
  }
  .zone-hero-name { font-size: 26px; font-weight: 900; letter-spacing: -1px; }
  .zone-hero-date { color: #9ca3af; font-size: 13px; margin-top: 4px; }
  .zone-hero-stats { display: flex; gap: 24px; flex-wrap: wrap; }
  .hero-stat { text-align: center; }
  .hero-stat-val { font-size: 28px; font-weight: 900; }
  .hero-stat-label { font-size: 10px; color: #6b7280; text-transform: uppercase; letter-spacing: 1px; margin-top: 2px; }

  /* VEHICLE FILTER */
  .vehicle-tabs { display: flex; gap: 8px; margin-bottom: 20px; flex-wrap: wrap; }
  .vehicle-btn {
    border-radius: 8px;
    padding: 6px 14px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    border: 1px solid rgba(255,255,255,0.08);
    background: rgba(255,255,255,0.03);
    color: #6b7280;
    transition: all 0.2s;
  }
  .vehicle-btn.active {
    background: rgba(99,102,241,0.25);
    border-color: rgba(99,102,241,0.5);
    color: #a5b4fc;
  }

  /* SECTION LABEL */
  .section-label {
    font-size: 12px;
    color: #6b7280;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-bottom: 12px;
  }

  /* METRICS GRID */
  .metrics-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(155px, 1fr));
    gap: 10px;
    margin-bottom: 28px;
  }

  .metric-card {
    border-radius: 12px;
    padding: 14px 16px;
    display: flex;
    flex-direction: column;
    gap: 6px;
    border: 1px solid rgba(255,255,255,0.1);
    background: rgba(255,255,255,0.04);
    transition: transform 0.15s;
  }
  .metric-card:hover { transform: translateY(-2px); }
  .metric-card.positive { background: rgba(16,185,129,0.08); border-color: rgba(16,185,129,0.3); }
  .metric-card.negative { background: rgba(239,68,68,0.08); border-color: rgba(239,68,68,0.3); }

  .metric-label { font-size: 10px; color: #9ca3af; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; }
  .metric-value-row { display: flex; align-items: baseline; gap: 4px; flex-wrap: wrap; }
  .metric-value { font-size: 22px; font-weight: 800; color: #f9fafb; }
  .metric-delta { font-size: 12px; font-weight: 700; margin-right: 2px; }
  .delta-up { color: #10b981; }
  .delta-down { color: #ef4444; }
  .delta-neutral { color: #6b7280; }
  .metric-prev { font-size: 11px; color: #6b7280; }

  /* WEEKLY GRID */
  .weekly-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
    gap: 8px;
    margin-bottom: 28px;
  }
  .weekly-card {
    background: rgba(99,102,241,0.1);
    border: 1px solid rgba(99,102,241,0.25);
    border-radius: 10px;
    padding: 12px 14px;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .weekly-label { font-size: 10px; color: #a5b4fc; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; }
  .weekly-value { font-size: 18px; font-weight: 800; color: #f9fafb; }

  /* ERROR */
  .error-box {
    background: rgba(239,68,68,0.1);
    border: 1px solid rgba(239,68,68,0.3);
    border-radius: 12px;
    padding: 16px;
    color: #fca5a5;
    margin-bottom: 20px;
    font-size: 14px;
    direction: ltr;
  }

  /* LOADING */
  .loading {
    text-align: center;
    padding: 60px;
    color: #6b7280;
    font-size: 16px;
  }
  .loading-icon { font-size: 36px; margin-bottom: 12px; animation: spin 1s linear infinite; display: inline-block; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* FOOTER */
  .footer { text-align: center; margin-top: 40px; color: #374151; font-size: 12px; padding-bottom: 30px; }

  /* MOBILE */
  @media (max-width: 600px) {
    .main { padding: 16px; }
    .metrics-grid { grid-template-columns: repeat(2, 1fr); }
    .zone-hero-name { font-size: 20px; }
    .hero-stat-val { font-size: 22px; }
  }
</style>
</head>
<body>

<div class="header">
  <div>
    <div class="header-title">⚡ Zone Dashboard</div>
    <div class="header-sub" id="last-updated">جاري التحميل...</div>
  </div>
  <button class="refresh-btn" onclick="loadData()" id="refresh-btn">🔄 Refresh</button>
</div>

<div class="main">
  <!-- Zone Tabs -->
  <div class="zone-tabs" id="zone-tabs"></div>

  <!-- Content -->
  <div id="content"></div>

  <div class="footer">Zone Dashboard • بيتحدث من Google Sheets مباشرة</div>
</div>

<script>
const SCRIPT_URL = "https://script.google.com/a/macros/talabat.com/s/AKfycbxqxp1eLsp6k5I3InWYzIEikZfk6Mahzzkr7t4wLOLWt7vwIt8eePwN9fsiH0jwF2CqYg/exec";

const ZONES = [
  { id: "CCC",      label: "Cairo City Centre", emoji: "🏙️", sheet: "CCC" },
  { id: "Giza",     label: "Giza",              emoji: "🏛️", sheet: "Giza" },
  { id: "Hadayek",  label: "Hadayek el Ahram",  emoji: "🌿", sheet: "Hadayek el ahram" },
];

const ZONE_METRICS = [
  { key:"runRate",    label:"Run Rate %",      col:7,  pct:true,  up:true  },
  { key:"lostOrders", label:"Lost Orders",     col:6,  pct:false, up:false },
  { key:"orders",     label:"Orders",          col:8,  pct:false, up:true  },
  { key:"utr",        label:"UTR",             col:10, pct:false, up:true  },
  { key:"failRate",   label:"Fail Rate %",     col:11, pct:true,  up:false },
  { key:"onTime",     label:"Order On Time %", col:16, pct:true,  up:true  },
  { key:"idleTime",   label:"Idle Time %",     col:17, pct:true,  up:false },
  { key:"noShow",     label:"No Show %",       col:19, pct:true,  up:false },
  { key:"active",     label:"Active Riders",   col:18, pct:false, up:true  },
  { key:"fillRate",   label:"Fill Rate %",     col:23, pct:true,  up:true  },
  { key:"lostHours",  label:"Lost Hours",      col:2,  pct:false, up:false },
  { key:"zoneTarget", label:"Zone Target %",   col:3,  pct:true,  up:true  },
];

const WEEKLY_METRICS = [
  { label:"Run Rate",     col:1,  pct:true  },
  { label:"Lost Orders",  col:2,  pct:false },
  { label:"Orders",       col:3,  pct:false },
  { label:"UTR",          col:5,  pct:false },
  { label:"Fail Rate",    col:6,  pct:true  },
  { label:"Order On Time",col:10, pct:true  },
  { label:"No Show",      col:8,  pct:true  },
  { label:"Fill Rate",    col:13, pct:true  },
];

const VEH_METRICS = [
  { label:"Orders",        col:4,  pct:false, up:true  },
  { label:"UTR",           col:5,  pct:false, up:true  },
  { label:"DT",            col:6,  pct:false, up:false },
  { label:"WH",            col:7,  pct:false, up:true  },
  { label:"RAT",           col:8,  pct:false, up:false },
  { label:"AR %",          col:9,  pct:true,  up:true  },
  { label:"Order On Time", col:10, pct:true,  up:true  },
  { label:"Idle Time %",   col:11, pct:true,  up:false },
  { label:"No Show %",     col:13, pct:true,  up:false },
  { label:"Fill Rate %",   col:14, pct:true,  up:true  },
];

let state = { zone: "CCC", vehicle: "all", data: {}, loading: false };

function parseNum(v) {
  if (!v || v === "" || v === "#DIV/0!" || v === "0.00%" || v === "0%") return null;
  return parseFloat(String(v).replace(/%/g,"").replace(/,/g,""));
}

function fmt(v, pct) {
  if (v === null || v === undefined) return "—";
  if (pct) return v.toFixed(1) + "%";
  return v >= 10000 ? (v/1000).toFixed(1)+"k" : v >= 1000 ? (v/1000).toFixed(1)+"k" : v % 1 === 0 ? v.toFixed(0) : v.toFixed(2);
}

async function fetchSheet(name) {
  const url = SCRIPT_URL + "?sheet=" + encodeURIComponent(name);
  const r = await fetch(url);
  if (!r.ok) throw new Error("فشل تحميل " + name + " — تأكد إنك سجلت دخول بـ talabat account");
  const d = await r.json();
  if (d.error) throw new Error(d.error);
  return d.values || [];
}

async function loadData() {
  if (state.loading) return;
  state.loading = true;
  document.getElementById("refresh-btn").disabled = true;
  document.getElementById("refresh-btn").textContent = "⏳ جاري التحميل...";
  render();

  try {
    const zone = ZONES.find(z => z.id === state.zone);
    const [zRows, vRows] = await Promise.all([
      fetchSheet(zone.sheet),
      fetchSheet("Vehicle Type Daily and Weekly"),
    ]);

    // Parse zone rows
    const dataRows = zRows.filter(r => r[1] && r[4] && r[0] !== "Week" && r[0] !== "ek" && r[0] !== "WK");
    const valid = dataRows.filter(r => parseNum(r[8]) > 0 && parseNum(r[7]) > 0);
    const today = valid[valid.length - 1];
    const yesterday = valid[valid.length - 2];

    // Weekly summary
    const wIdx = zRows.findIndex(r => String(r[1]).toLowerCase() === "week" || String(r[0]).toLowerCase() === "week");
    let latestWeek = null;
    if (wIdx !== -1) {
      const wRows = zRows.slice(wIdx + 1).filter(r => parseNum(r[0]) > 0);
      if (wRows.length) latestWeek = wRows[wRows.length - 1];
    }

    // Vehicle rows for this zone
    const zoneKey = zone.sheet.toLowerCase().split(" ")[0];
    const zVehicle = vRows.filter(r => r[1] && r[1].toLowerCase().includes(zoneKey));
    const validV = zVehicle.filter(r => parseNum(r[4]) > 0);
    const dates = [...new Set(validV.map(r => r[2]))];
    const todayV = validV.filter(r => r[2] === dates[dates.length - 1]);
    const yesterV = validV.filter(r => r[2] === dates[dates.length - 2]);

    state.data = { today, yesterday, latestWeek, todayV, yesterV };
    document.getElementById("last-updated").textContent = "آخر تحديث: " + new Date().toLocaleTimeString("ar-EG");
  } catch(e) {
    state.data = { error: e.message };
  }

  state.loading = false;
  document.getElementById("refresh-btn").disabled = false;
  document.getElementById("refresh-btn").innerHTML = "🔄 Refresh";
  render();
}

function deltaHTML(curr, prev, up, pct) {
  if (curr === null || prev === null) return "";
  const diff = curr - prev;
  if (Math.abs(diff) < 0.01) return `<span class="metric-delta delta-neutral">—</span>`;
  const positive = up ? diff > 0 : diff < 0;
  const cls = positive ? "delta-up" : "delta-down";
  const arrow = diff > 0 ? "▲" : "▼";
  return `<span class="metric-delta ${cls}">${arrow} ${Math.abs(diff).toFixed(1)}${pct?"%":""}</span>`;
}

function metricCardHTML(label, curr, prev, up, pct) {
  const c = parseNum(curr), p = parseNum(prev);
  const positive = (c!==null && p!==null) ? (up ? c>=p : c<=p) : null;
  const cls = positive===null ? "" : positive ? "positive" : "negative";
  return `
    <div class="metric-card ${cls}">
      <div class="metric-label">${label}</div>
      <div class="metric-value-row">
        <span class="metric-value">${fmt(c,pct)}</span>
        ${deltaHTML(c,p,up,pct)}
      </div>
      ${p!==null ? `<div class="metric-prev">أمس: ${fmt(p,pct)}</div>` : ""}
    </div>`;
}

function weeklyCardHTML(label, val, pct) {
  return `
    <div class="weekly-card">
      <div class="weekly-label">${label}</div>
      <div class="weekly-value">${fmt(parseNum(val),pct)}</div>
    </div>`;
}

function render() {
  const content = document.getElementById("content");

  // Zone tabs
  document.getElementById("zone-tabs").innerHTML = ZONES.map(z =>
    `<button class="zone-btn ${state.zone===z.id?'active':''}" onclick="setZone('${z.id}')">${z.emoji} ${z.label}</button>`
  ).join("");

  if (state.loading) {
    content.innerHTML = `<div class="loading"><div class="loading-icon">⚙️</div><br>جاري تحميل البيانات من الشيت...</div>`;
    return;
  }

  const { today, yesterday, latestWeek, todayV, yesterV, error } = state.data;

  if (error) {
    content.innerHTML = `<div class="error-box">❌ ${error}</div>`;
    return;
  }

  if (!today) {
    content.innerHTML = `<div class="loading">لا توجد بيانات متاحة</div>`;
    return;
  }

  const zone = ZONES.find(z => z.id === state.zone);

  // Run rate color
  const rr = parseNum(today[7]);
  const rrColor = rr >= 90 ? "#10b981" : rr >= 80 ? "#f59e0b" : "#ef4444";
  const lo = parseNum(today[6]);
  const loColor = lo <= 300 ? "#10b981" : lo <= 600 ? "#f59e0b" : "#ef4444";

  // Vehicle tabs
  const vehicleTabs = `
    <div class="vehicle-tabs">
      <button class="vehicle-btn ${state.vehicle==='all'?'active':''}" onclick="setVehicle('all')">📊 All</button>
      <button class="vehicle-btn ${state.vehicle==='Bike'?'active':''}" onclick="setVehicle('Bike')">🏍️ Bike</button>
      <button class="vehicle-btn ${state.vehicle==='Bicycle'?'active':''}" onclick="setVehicle('Bicycle')">🚲 Bicycle</button>
    </div>`;

  // Zone hero
  const hero = `
    <div class="zone-hero">
      <div>
        <div class="zone-hero-name">${zone.emoji} ${zone.label}</div>
        <div class="zone-hero-date">📅 ${today[4] || "—"} &nbsp;|&nbsp; Week ${today[0] || "—"}</div>
      </div>
      <div class="zone-hero-stats">
        <div class="hero-stat">
          <div class="hero-stat-val" style="color:${rrColor}">${fmt(rr,true)}</div>
          <div class="hero-stat-label">Run Rate</div>
        </div>
        <div class="hero-stat">
          <div class="hero-stat-val" style="color:${loColor}">${fmt(lo,false)}</div>
          <div class="hero-stat-label">Lost Orders</div>
        </div>
        <div class="hero-stat">
          <div class="hero-stat-val" style="color:#6366f1">${fmt(parseNum(today[8]),false)}</div>
          <div class="hero-stat-label">Orders</div>
        </div>
      </div>
    </div>`;

  let mainContent = "";

  if (state.vehicle === "all") {
    // Daily metrics
    const metricsGrid = ZONE_METRICS.map(m =>
      metricCardHTML(m.label, today[m.col], yesterday?.[m.col], m.up, m.pct)
    ).join("");

    // Weekly
    let weeklySection = "";
    if (latestWeek) {
      const weekCards = WEEKLY_METRICS.map(m =>
        weeklyCardHTML(m.label, latestWeek[m.col], m.pct)
      ).join("");
      weeklySection = `
        <div class="section-label">📅 الأسبوع — Week ${latestWeek[0]}</div>
        <div class="weekly-grid">${weekCards}</div>`;
    }

    mainContent = `
      <div class="section-label">📊 اليوم مقارنة بالأمس</div>
      <div class="metrics-grid">${metricsGrid}</div>
      ${weeklySection}`;

  } else {
    // Vehicle breakdown
    const todayRow = (todayV||[]).find(r => r[3] === state.vehicle);
    const yesterRow = (yesterV||[]).find(r => r[3] === state.vehicle);
    const vIcon = state.vehicle === "Bike" ? "🏍️" : "🚲";

    const vCards = VEH_METRICS.map(m =>
      metricCardHTML(m.label, todayRow?.[m.col], yesterRow?.[m.col], m.up, m.pct)
    ).join("");

    mainContent = `
      <div class="section-label">${vIcon} ${state.vehicle} — اليوم مقارنة بالأمس</div>
      <div class="metrics-grid">${vCards}</div>`;
  }

  content.innerHTML = hero + vehicleTabs + mainContent;
}

function setZone(id) {
  state.zone = id;
  state.vehicle = "all";
  state.data = {};
  loadData();
}

function setVehicle(v) {
  state.vehicle = v;
  render();
}

// Init
loadData();
</script>
</body>
</html>
