<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ups and Downs Dashboard</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
:root {
  --orange: #FF6B00;
  --orange-light: #FF8C00;
  --bg: #0d0d0d;
  --bg2: #1a1a1a;
  --bg3: #242424;
  --green: #10b981;
  --red: #ef4444;
  --text: #f5f5f5;
  --text2: #a0a0a0;
}
body { font-family: 'Segoe UI', -apple-system, sans-serif; background: var(--bg); min-height: 100vh; color: var(--text); }

/* HEADER */
.header {
  background: linear-gradient(135deg, #1a0a00, #2d1200);
  border-bottom: 2px solid var(--orange);
  padding: 14px 24px;
  display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px;
  position: sticky; top: 0; z-index: 100;
}
.header-left { display: flex; align-items: center; gap: 14px; }
.talabat-logo { background: var(--orange); color: #fff; font-size: 11px; font-weight: 900; padding: 5px 10px; border-radius: 6px; letter-spacing: 1px; }
.header-title { font-size: 18px; font-weight: 900; color: var(--text); }
.header-zone-name { font-size: 13px; color: var(--orange); font-weight: 700; margin-top: 2px; }
.header-sub { font-size: 11px; color: var(--text2); margin-top: 1px; }
.refresh-btn { background: var(--orange); border: none; color: #fff; border-radius: 8px; padding: 8px 18px; font-size: 13px; font-weight: 700; cursor: pointer; transition: all 0.2s; }
.refresh-btn:hover { background: var(--orange-light); }

/* MAIN */
.main { padding: 20px 24px; max-width: 1280px; margin: 0 auto; }

/* ZONE TABS */
.zone-tabs { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
.zone-btn { border-radius: 10px; padding: 10px 22px; font-size: 14px; font-weight: 700; cursor: pointer; border: 1px solid rgba(255,107,0,0.2); background: var(--bg2); color: var(--text2); transition: all 0.2s; }
.zone-btn.active { background: var(--orange); border-color: var(--orange); color: #fff; }
.zone-btn:hover:not(.active) { border-color: var(--orange); color: var(--text); }

/* VIEW TABS */
.view-tabs { display: flex; gap: 8px; margin-bottom: 20px; flex-wrap: wrap; }
.view-btn { border-radius: 8px; padding: 7px 16px; font-size: 13px; font-weight: 600; cursor: pointer; border: 1px solid rgba(255,255,255,0.1); background: var(--bg3); color: var(--text2); transition: all 0.2s; }
.view-btn.active { background: rgba(255,107,0,0.2); border-color: var(--orange); color: var(--orange); }

/* HERO */
.zone-hero {
  background: linear-gradient(135deg, rgba(255,107,0,0.12), rgba(255,107,0,0.05));
  border: 1px solid rgba(255,107,0,0.3); border-radius: 14px; padding: 18px 24px;
  margin-bottom: 20px; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 16px;
}
.zone-hero-name { font-size: 24px; font-weight: 900; color: var(--orange); }
.zone-hero-date { color: var(--text2); font-size: 12px; margin-top: 4px; }
.hero-stats { display: flex; gap: 28px; flex-wrap: wrap; }
.hero-stat { text-align: center; }
.hero-stat-val { font-size: 26px; font-weight: 900; }
.hero-stat-label { font-size: 10px; color: var(--text2); text-transform: uppercase; letter-spacing: 1px; margin-top: 2px; }

/* VEHICLE FILTER */
.vehicle-tabs { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
.vehicle-btn { border-radius: 8px; padding: 6px 14px; font-size: 13px; font-weight: 600; cursor: pointer; border: 1px solid rgba(255,255,255,0.08); background: var(--bg3); color: var(--text2); transition: all 0.2s; }
.vehicle-btn.active { background: rgba(255,107,0,0.15); border-color: rgba(255,107,0,0.4); color: var(--orange); }

/* SECTION LABEL */
.section-label { font-size: 11px; color: var(--text2); font-weight: 700; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }
.section-label::after { content: ''; flex: 1; height: 1px; background: rgba(255,107,0,0.15); }

/* METRICS GRID */
.metrics-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(155px, 1fr)); gap: 10px; margin-bottom: 24px; }
.metric-card { border-radius: 10px; padding: 14px 16px; display: flex; flex-direction: column; gap: 5px; border: 1px solid rgba(255,255,255,0.07); background: var(--bg2); transition: transform 0.15s, border-color 0.15s; }
.metric-card:hover { transform: translateY(-2px); border-color: rgba(255,107,0,0.3); }
.metric-card.positive { background: rgba(16,185,129,0.07); border-color: rgba(16,185,129,0.25); }
.metric-card.negative { background: rgba(239,68,68,0.07); border-color: rgba(239,68,68,0.25); }
.metric-label { font-size: 10px; color: var(--text2); font-weight: 600; text-transform: uppercase; letter-spacing: 0.8px; }
.metric-value-row { display: flex; align-items: baseline; gap: 4px; flex-wrap: wrap; }
.metric-value { font-size: 22px; font-weight: 800; color: var(--text); }
.metric-delta { font-size: 11px; font-weight: 700; }
.delta-up { color: var(--green); }
.delta-down { color: var(--red); }
.metric-prev { font-size: 11px; color: var(--text2); }

/* WEEKLY TABLE */
.weekly-table-wrap { overflow-x: auto; overflow-y: auto; max-height: 75vh; margin-bottom: 24px; border-radius: 10px; border: 1px solid rgba(255,107,0,0.15); }
.weekly-table { width: 100%; border-collapse: collapse; font-size: 12px; }
.weekly-table th { background: #1a0a00; color: var(--orange); padding: 10px 12px; text-align: center; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; white-space: nowrap; position: sticky; top: 0; z-index: 10; border-bottom: 2px solid var(--orange); }
.weekly-table td { padding: 9px 12px; text-align: center; border-bottom: 1px solid rgba(255,255,255,0.04); white-space: nowrap; color: var(--text); font-size: 13px; font-weight: 600; }
.weekly-table tr:hover td { background: rgba(255,107,0,0.15); color: #fff; transition: background 0.15s; }
.weekly-table tr:hover td:first-child { background: #2a1200 !important; color: var(--orange); }
.weekly-table tr:last-child td { border-bottom: none; }
.weekly-table td:first-child { color: var(--orange); font-weight: 800; font-size: 14px; position: sticky; left: 0; background: #0d0d0d; z-index: 5; white-space: nowrap; border-right: 1px solid rgba(255,107,0,0.2); min-width: 90px; max-width: 90px; width: 90px; }
.weekly-table th:first-child { position: sticky; left: 0; z-index: 15; background: #1a0a00; border-right: 1px solid rgba(255,107,0,0.2); min-width: 90px; max-width: 90px; width: 90px; }

/* HISTORY TABLE */
.history-table-wrap { overflow-x: auto; overflow-y: auto; max-height: 75vh; margin-bottom: 24px; border-radius: 10px; border: 1px solid rgba(255,107,0,0.15); }
.history-table { width: 100%; border-collapse: collapse; font-size: 12px; }
.history-table th { background: rgba(30,10,0,0.98); color: var(--orange); padding: 10px 12px; text-align: center; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; white-space: nowrap; position: sticky; top: 0; z-index: 10; }
.history-table td { padding: 8px 12px; text-align: center; border-bottom: 1px solid rgba(255,255,255,0.04); white-space: nowrap; color: var(--text); }
.history-table tr:hover td { background: rgba(255,107,0,0.15); color: #fff; transition: background 0.15s; }
.history-table tr:hover td:first-child { background: #2a1200 !important; color: var(--text2); }
.history-table tr:last-child td { border-bottom: none; }
.history-table td:first-child { color: var(--text2); font-size: 11px; text-align: left; position: sticky; left: 0; background: #0d0d0d; z-index: 5; white-space: nowrap; border-right: 1px solid rgba(255,107,0,0.2); min-width: 90px; max-width: 90px; width: 90px; }
.history-table th:first-child { position: sticky; left: 0; z-index: 15; background: #1a0a00; border-right: 1px solid rgba(255,107,0,0.2); min-width: 90px; max-width: 90px; width: 90px; }
.td-good { color: var(--green) !important; font-weight: 700; }
.td-bad { color: var(--red) !important; font-weight: 700; }

/* NO DATA */
.no-data-box { background: rgba(255,107,0,0.06); border: 1px solid rgba(255,107,0,0.2); border-radius: 12px; padding: 40px 24px; text-align: center; color: var(--text2); font-size: 14px; margin-bottom: 20px; }
.no-data-box strong { display: block; color: var(--orange); font-size: 18px; margin-bottom: 8px; }

.error-box { background: rgba(239,68,68,0.08); border: 1px solid rgba(239,68,68,0.25); border-radius: 10px; padding: 16px; color: #fca5a5; margin-bottom: 20px; font-size: 14px; }
.loading { text-align: center; padding: 60px; color: var(--text2); font-size: 15px; }

/* GLOSSARY */
.glossary-search { width: 100%; padding: 12px 16px; border-radius: 10px; border: 1px solid rgba(255,107,0,0.3); background: var(--bg2); color: var(--text); font-size: 14px; margin-bottom: 16px; outline: none; }
.glossary-search:focus { border-color: var(--orange); }
.glossary-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 10px; margin-bottom: 24px; }
.glossary-card { background: var(--bg2); border: 1px solid rgba(255,255,255,0.07); border-radius: 10px; padding: 14px 16px; transition: border-color 0.15s; }
.glossary-card:hover { border-color: rgba(255,107,0,0.4); }
.glossary-term { font-size: 13px; font-weight: 800; color: var(--orange); margin-bottom: 4px; }
.glossary-full { font-size: 11px; color: var(--text2); margin-bottom: 6px; font-style: italic; }
.glossary-def { font-size: 12px; color: var(--text); line-height: 1.6; }
.glossary-formula { font-size: 11px; color: #a78bfa; margin-top: 6px; background: rgba(167,139,250,0.08); border-radius: 6px; padding: 4px 8px; font-family: monospace; }
.glossary-hidden { display: none; }

/* LOGIN */
.login-overlay { position: fixed; top:0; left:0; width:100%; height:100%; background: #0d0d0d; z-index: 9999; display: flex; align-items: center; justify-content: center; }
.login-box { background: #1a1a1a; border: 1px solid rgba(255,107,0,0.3); border-radius: 16px; padding: 40px 36px; width: 340px; text-align: center; }
.login-logo { background: var(--orange); color: #fff; font-size: 13px; font-weight: 900; padding: 6px 14px; border-radius: 8px; display: inline-block; margin-bottom: 20px; }
.login-title { font-size: 20px; font-weight: 900; color: var(--text); margin-bottom: 6px; }
.login-sub { font-size: 12px; color: var(--text2); margin-bottom: 28px; }
.login-input { width: 100%; padding: 11px 14px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.1); background: #242424; color: var(--text); font-size: 14px; margin-bottom: 12px; outline: none; box-sizing: border-box; }
.login-input:focus { border-color: var(--orange); }
.login-btn { width: 100%; padding: 12px; border-radius: 8px; background: var(--orange); border: none; color: #fff; font-size: 15px; font-weight: 700; cursor: pointer; margin-top: 4px; transition: background 0.2s; }
.login-btn:hover { background: var(--orange-light); }
.login-error { color: #ef4444; font-size: 12px; margin-top: 10px; }

/* TOP BOTTOM */
.tb-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 12px; margin-bottom: 24px; }
.tb-card { background: var(--bg2); border: 1px solid rgba(255,255,255,0.07); border-radius: 12px; padding: 14px 16px; }
.tb-card-label { font-size: 11px; color: var(--text2); font-weight: 700; text-transform: uppercase; letter-spacing: 0.8px; margin-bottom: 10px; }
.tb-row { display: flex; justify-content: space-between; align-items: center; padding: 7px 0; border-bottom: 1px solid rgba(255,255,255,0.04); }
.tb-row:last-child { border-bottom: none; }
.tb-row-label { font-size: 11px; color: var(--text2); }
.tb-row-val { font-size: 13px; font-weight: 800; }
.tb-row-date { font-size: 10px; color: var(--text2); margin-top: 2px; }
.tb-best { border-color: rgba(16,185,129,0.3); background: rgba(16,185,129,0.05); }
.tb-worst { border-color: rgba(239,68,68,0.3); background: rgba(239,68,68,0.05); }
.tb-best .tb-card-label { color: var(--green); }
.tb-worst .tb-card-label { color: var(--red); }

/* FOOTER */
.footer { text-align: center; margin-top: 40px; color: #555; font-size: 12px; padding-bottom: 30px; }
.footer span { color: var(--orange); font-weight: 700; }

@media (max-width: 600px) {
  /* Layout */
  .main { padding: 10px; }
  .header { padding: 10px 14px; }
  .header-title { font-size: 15px; }
  .header-zone-name { font-size: 12px; }

  /* Zone tabs */
  .zone-tabs { gap: 6px; }
  .zone-btn { padding: 8px 14px; font-size: 12px; }

  /* View tabs - scrollable */
  .view-tabs { display: flex; flex-wrap: nowrap; overflow-x: auto; gap: 6px; padding-bottom: 4px; -webkit-overflow-scrolling: touch; }
  .view-btn { padding: 6px 12px; font-size: 12px; white-space: nowrap; flex-shrink: 0; }

  /* Vehicle tabs */
  .vehicle-tabs { gap: 6px; }
  .vehicle-btn { padding: 5px 12px; font-size: 12px; }

  /* Hero */
  .zone-hero { padding: 14px 16px; }
  .zone-hero-name { font-size: 18px; }
  .hero-stat-val { font-size: 20px; }
  .hero-stats { gap: 16px; }

  /* Metrics grid - 2 columns on mobile */
  .metrics-grid { grid-template-columns: repeat(2, 1fr); gap: 8px; }
  .metric-card { padding: 10px 12px; }
  .metric-value { font-size: 18px; }

  /* Top Bottom grid */
  .tb-grid { grid-template-columns: 1fr 1fr; gap: 8px; }
  .tb-card { padding: 10px 12px; }

  /* Glossary grid */
  .glossary-grid { grid-template-columns: 1fr; }

  /* Tables - horizontal scroll */
  .history-table-wrap { max-height: 60vh; }
  .weekly-table-wrap { max-height: 60vh; }
  .history-table td, .history-table th { padding: 7px 8px; font-size: 11px; }
  .weekly-table td, .weekly-table th { padding: 7px 8px; font-size: 11px; }
  .history-table td:first-child { font-size: 10px; min-width: 75px; max-width: 75px; width: 75px; }
  .weekly-table td:first-child { font-size: 11px; min-width: 70px; max-width: 70px; width: 70px; }
}
</style>
</head>
<body>

<div class="login-overlay" id="login-overlay">
  <div class="login-box">
    <div class="login-logo">Talabat</div>
    <div class="login-title">Zone Performance Overview</div>
    <div class="login-sub">Please sign in to continue</div>
    <input class="login-input" type="text" id="login-user" placeholder="Username" autocomplete="username" />
    <input class="login-input" type="password" id="login-pass" placeholder="Password" autocomplete="current-password" onkeydown="if(event.key==='Enter') doLogin()" />
    <button class="login-btn" onclick="doLogin()">Sign In</button>
    <div class="login-error" id="login-error" style="display:none;">❌ Incorrect username or password</div>
  </div>
</div>

<div class="header">
  <div class="header-left">
    <div class="talabat-logo">Talabat</div>
    <div>
      <div class="header-title">Zone Performance Overview</div>
      <div class="header-zone-name" id="header-zone-name">—</div>
      <div class="header-sub" id="last-updated">Loading...</div>
    </div>
  </div>
  <button class="refresh-btn" onclick="loadData()" id="refresh-btn">🔄 Refresh</button>
</div>

<div class="main">
  <div class="zone-tabs" id="zone-tabs"></div>
  <div id="content"></div>
  <div class="footer">Talabat Zone Dashboard • <span>Mahmoud Younis</span></div>
</div>

<script>
const DATA_URL = "https://raw.githubusercontent.com/ma3297211-lang/Zone-dashboar/main/data.json";

// ── LOGIN ──
const CREDENTIALS = { username: "Giza.hub", password: "Talabat123" };

function doLogin() {
  const u = document.getElementById("login-user").value.trim();
  const p = document.getElementById("login-pass").value.trim();
  const err = document.getElementById("login-error");
  if (u === CREDENTIALS.username && p === CREDENTIALS.password) {
    document.getElementById("login-overlay").style.display = "none";
    loadData();
  } else {
    err.style.display = "block";
    document.getElementById("login-pass").value = "";
  }
}

// ── ZONE DEFINITIONS ──
// headerRow[27] = WH Target value, headerRow[29] = UTR target value  (index 0-based in the first array row)
const ZONES = [
  { id:"CCC",     label:"Cairo City Centre", emoji:"🏙️", key:"CCC",             vehicleMatch:"cairo_city_centre", whTarget:7960,  utrTarget:1.94 },
  { id:"Giza",    label:"Giza",              emoji:"🕌", key:"Giza",            vehicleMatch:"giza",              whTarget:11850, utrTarget:1.83 },
  { id:"Hadayek", label:"Hadayek el Ahram",  emoji:"🌆", key:"Hadayek",          vehicleMatch:"hadayek",           whTarget:5780,  utrTarget:1.83 },
];

// ── TODAY vs YESTERDAY columns (zone daily rows) ──
const ZONE_METRICS = [
  { label:"Run Rate %",      col:7,  pct:true,  up:true,  goodFn: v => v >= 0.9 },
  { label:"Lost Orders",     col:6,  pct:false, up:false, isInt:true },
  { label:"Orders",          col:8,  pct:false, up:true,  isInt:true },
  { label:"WH",              col:9,  pct:false, up:true,  isInt:true },
  { label:"UTR",             col:10, pct:false, up:false },
  { label:"Fail Rate %",     col:11, pct:true,  up:false, goodFn: v => v <= 0.03 },
  { label:"TR Fail %",       col:12, pct:true,  up:false, goodFn: v => v <= 0.002 },
  { label:"DT",              col:13, pct:false, up:false, isDec1:true, goodFn: v => v <= 28 },
  { label:"RAT",             col:14, pct:false, up:false, isDec1:true },
  { label:"AR %",            col:15, pct:true,  up:true,  goodFn: v => v >= 0.96 },
  { label:"Order On Time %", col:16, pct:true,  up:true,  goodFn: v => v >= 0.79 },
  { label:"Idle Time %",     col:17, pct:true,  up:false },
  { label:"Breaks %",        col:18, pct:true,  up:false },
  { label:"Active Riders",   col:19, pct:false, up:true,  isInt:true },
  { label:"No Show %",       col:20, pct:true,  up:false },
  { label:"AVP %",           col:21, pct:true,  up:true,  goodFn: v => v >= 0.85 },
  { label:"AVG WH/Rider",    col:22, pct:false, up:true,  isDec1:true, goodFn: v => v >= 7 },
  { label:"Fill Rate %",     col:23, pct:true,  up:true,  goodFn: v => v >= 0.7 },
  { label:"Late Login %",    col:24, pct:true,  up:false },
];

// ── WEEKLY SUMMARY columns ──
// Actual data.json weekly row structure (0-based):
// ["","","","", Week(4), RunRate%(5), LostOrders(6), Orders(7), WH(8), UTR(9),
//  FailRate%(10), TRFail(11), DT(12), RAT(13), AR(14),
//  OrderOnTime(15), IdleTime%(16), Breaks%(17), Active(18), NoShow%(19),
//  AVP%(20), AVGWHperRider(21), FillRate(22), LateLogin(23)]
const WEEKLY_COLS = [
  { label:"Run Rate %",        col:5,  pct:true,  fmt:"pct",  goodFn: v => v >= 0.9,   up:true,  arrow:true },
  { label:"Lost Orders",       col:6,  pct:false, fmt:"int",  up:false, arrow:true  },
  { label:"Orders",            col:7,  pct:false, fmt:"int",  up:true,  arrow:true  },
  { label:"WH",                col:8,  pct:false, fmt:"int",  up:true,  arrow:true  },
  { label:"UTR",               col:9,  pct:false, fmt:"dec2", up:false, arrow:true  },
  { label:"Fail Rate %",       col:10, pct:true,  fmt:"pct",  goodFn: v => v <= 0.03,  up:false, arrow:true },
  { label:"TR Fail",           col:11, pct:true,  fmt:"pct",  goodFn: v => v <= 0.002, up:false, arrow:true },
  { label:"DT",                col:12, pct:false, fmt:"dec1", goodFn: v => v <= 28,    up:false, arrow:true },
  { label:"RAT",               col:13, pct:false, fmt:"dec1", up:false, arrow:true  },
  { label:"AR",                col:14, pct:true,  fmt:"pct",  goodFn: v => v >= 0.96,  up:true,  arrow:true },
  { label:"Order On Time",     col:15, pct:true,  fmt:"pct",  goodFn: v => v >= 0.79,  up:true,  arrow:true },
  { label:"% Idle Time",       col:16, pct:true,  fmt:"pct",  up:false, arrow:true  },
  { label:"Breaks%",           col:17, pct:true,  fmt:"pct",  up:false, arrow:true  },
  { label:"Active",            col:18, pct:false, fmt:"int",  up:true,  arrow:true  },
  { label:"NO Show %",         col:19, pct:true,  fmt:"pct",  up:false, arrow:true  },
  { label:"AVP %",             col:20, pct:true,  fmt:"pct",  goodFn: v => v >= 0.85,  up:true,  arrow:true },
  { label:"AVG WH per rider",  col:21, pct:false, fmt:"dec1", goodFn: v => v >= 7,     up:true,  arrow:true },
  { label:"Fill Rate",         col:22, pct:true,  fmt:"pct",  goodFn: v => v >= 0.7,   up:true,  arrow:true },
  { label:"Late login",        col:23, pct:true,  fmt:"pct",  up:false, arrow:true  },
];

// ── HISTORY TABLE columns ──
const HISTORY_COLS = [
  { label:"Orders",          col:8,  pct:false, fmt:"int",  goodFn: v => v > 0 },
  { label:"WH",              col:9,  pct:false, fmt:"int",  goodFn: v => v > 0 },
  { label:"UTR",             col:10, pct:false, fmt:"dec2", goodFn: v => v <= 2.1, invertColor: true },
  { label:"Run Rate %",      col:7,  pct:true,  fmt:"pct",  goodFn: v => v >= 0.9 },
  { label:"Lost Orders",     col:6,  pct:false, fmt:"int",  goodFn: v => v <= 400, invertColor: true },
  { label:"Fail Rate %",     col:11, pct:true,  fmt:"pct",  goodFn: v => v <= 0.03, invertColor: true },
  { label:"TR Fail %",       col:12, pct:true,  fmt:"pct",  goodFn: v => v <= 0.002, invertColor: true },

// ── HELPERS ──
function parseNum(v) {
  if (v === null || v === undefined || v === "" || v === "#DIV/0!") return null;
  const n = parseFloat(String(v).replace(/,/g,"").replace(/%/g,"").trim());
  return isNaN(n) ? null : n;
}

function toDisplay(v, pct) {
  if (v === null) return null;
  // Values stored as decimals: 0.91 = 91%, 1.011 = 101.1%
  // Threshold: if absolute value < 10, treat as decimal and multiply
  if (pct && Math.abs(v) < 10) return v * 100;
  return v;
}

function fmt(v, pct, full, decimals) {
  if (v === null || v === undefined) return "—";
  const d = toDisplay(v, pct);
  if (d === null) return "—";
  if (pct) return d.toFixed(1) + "%";
  if (decimals === 0) return Number(Math.round(d)).toLocaleString();
  if (decimals === 1) return d.toFixed(1);
  return d % 1 === 0 ? Number(Math.round(d)).toLocaleString() : d.toFixed(2);
}

function fmtFull(v, pct) {
  return fmt(v, pct, true);
}

function fmtInt(v) {
  if (v === null || v === undefined) return "—";
  const n = parseNum(v);
  if (n === null) return "—";
  return Number(Math.round(n)).toLocaleString();
}

function fmtDec1(v) {
  return fmt(v, false, true, 1);
}

function fmtDate(d) {
  if (!d) return "—";
  const s = String(d);
  if (s.includes("T")) {
    try { return new Date(s).toLocaleDateString("en-GB",{weekday:"short",day:"numeric",month:"short"}); } catch(e) {}
  }
  return s;
}

function deltaHTML(curr, prev, up, pct, isInt, isDec1) {
  if (curr === null || prev === null) return "";
  const c = toDisplay(curr, pct), p = toDisplay(prev, pct);
  if (c === null || p === null) return "";
  const diff = c - p;
  if (Math.abs(diff) < 0.001) return `<span class="metric-delta" style="color:#666">→0</span>`;
  const positive = up ? diff > 0 : diff < 0;
  const cls = positive ? "delta-up" : "delta-down";
  const arrow = diff > 0 ? "▲" : "▼";
  const abs = Math.abs(diff);
  let f;
  if (isInt) f = Math.round(abs).toLocaleString();
  else if (isDec1) f = abs.toFixed(1);
  else f = abs >= 100 ? abs.toFixed(0) : abs >= 10 ? abs.toFixed(1) : abs.toFixed(2);
  return `<span class="metric-delta ${cls}">${arrow}${f}${pct?"%":""}</span>`;
}

function metricCardHTML(label, curr, prev, up, pct, isInt, goodFn, isDec1) {
  const c = parseNum(curr), p = parseNum(prev);
  const cd = toDisplay(c,pct), pd = toDisplay(p,pct);
  let positive;
  if (goodFn && c !== null) {
    positive = goodFn(c);
  } else {
    positive = (cd!==null && pd!==null) ? (up ? cd>=pd : cd<=pd) : null;
  }
  const cls = positive===null ? "" : positive ? "positive" : "negative";
  const displayVal = isInt ? fmtInt(c) : isDec1 ? fmtDec1(c) : fmt(c,pct);
  const displayPrev = isInt ? fmtInt(p) : isDec1 ? fmtDec1(p) : fmt(p,pct);
  return `<div class="metric-card ${cls}">
    <div class="metric-label">${label}</div>
    <div class="metric-value-row">
      <span class="metric-value">${displayVal}</span>
      ${deltaHTML(c,p,up,pct,isInt,isDec1)}
    </div>
    ${pd!==null ? `<div class="metric-prev">Yesterday: ${displayPrev}</div>` : ""}
  </div>`;
}

// ── DATA ACCESS ──
function getZoneDef() { return ZONES.find(z => z.id === state.zone); }

function getSheetRows() {
  if (!state.rawData) return [];
  const zd = getZoneDef();
  if (state.rawData[zd.key]) return state.rawData[zd.key];
  // Fallback: case-insensitive
  const k = Object.keys(state.rawData).find(k => k.toLowerCase() === zd.key.toLowerCase());
  return k ? state.rawData[k] : [];
}

function getValidZoneRows() {
  return getSheetRows().filter(r =>
    Array.isArray(r) && r[1] && r[4] && String(r[4]).includes("T") && parseNum(r[8]) > 0
  );
}

function getWeeklyRows() {
  const all = getSheetRows();
  // Weekly summary block header row has "Week" in col[4] and "Run Rate %" in col[5]
  const wIdx = all.findIndex(r =>
    Array.isArray(r) &&
    String(r[4]).toLowerCase().trim() === "week" &&
    String(r[5]).toLowerCase().includes("run")
  );
  if (wIdx === -1) return [];
  // Data rows: col[4] is the week number, col[5] is RunRate (not #DIV/0!)
  return all.slice(wIdx+1).filter(r =>
    Array.isArray(r) &&
    parseNum(r[4]) > 0 &&
    r[5] !== "#DIV/0!" &&
    r[5] !== ""
  );
}

async function loadData() {
  document.getElementById("refresh-btn").textContent = "⏳ Loading...";
  document.getElementById("content").innerHTML = `<div class="loading">⏳ Loading data...</div>`;
  try {
    const r = await fetch(DATA_URL + "?t=" + Date.now());
    if (!r.ok) throw new Error("HTTP " + r.status);
    state.rawData = await r.json();
    document.getElementById("last-updated").textContent = "Updated: " + new Date().toLocaleTimeString("en-GB");
  } catch(e) {
    document.getElementById("content").innerHTML = `<div class="error-box">❌ ${e.message}</div>`;
  }
  document.getElementById("refresh-btn").textContent = "🔄 Refresh";
  render();
}

        const eventVal = r[25] ? String(r[25]).trim() : "";
        const rowStyle = eventVal ? `style="background:rgba(245,158,11,0.08);border-left:3px solid #f59e0b;"` : "";
        const eventBadge = eventVal ? `<span title="${eventVal}" style="cursor:help;font-size:11px;margin-left:5px;">📌</span>` : "";
        return `<tr ${rowStyle}><td>${fmtDate(r[4])}${eventBadge}</td>${cells}</tr>`;
      }).join("");
      mainContent = `
        <div class="section-label">📆 Daily Performance — All</div>
        ${dailyVehicleTabs}
        <div class="history-table-wrap">
          <table class="history-table">
            <thead><tr><th>DATE</th>${headerCells}</tr></thead>
            <tbody>${bodyRows}</tbody>
          </table>
        </div>`;

    } else {
      // Vehicle daily rows
      const vType = effectiveDailyVehicle;
      const vRows = validV.filter(r => r[3] === vType);
      const vDailyDates = [...new Set(vRows.map(r => r[2]))].sort();

      // Vehicle daily cols
      const VEH_DAILY_COLS = [
        { label:"Orders",      col:4,  pct:false, fmt:"int",  up:true,  goodFn: null },
        { label:"UTR",         col:5,  pct:false, fmt:"dec2", up:false, goodFn: null },
        { label:"DT",          col:6,  pct:false, fmt:"dec1", up:false, goodFn: v => v <= 28 },
        { label:"WH",          col:7,  pct:false, fmt:"int",  up:true,  goodFn: null },
        { label:"RAT",         col:8,  pct:false, fmt:"dec1", up:false, goodFn: null },
        { label:"AR %",        col:9,  pct:true,  fmt:"pct",  up:true,  goodFn: v => v >= 0.96 },
        { label:"On Time %",   col:10, pct:true,  fmt:"pct",  up:true,  goodFn: v => v >= 0.79 },
        { label:"Idle Time %", col:11, pct:true,  fmt:"pct",  up:false, goodFn: null },
        { label:"No Show %",   col:13, pct:true,  fmt:"pct",  up:false, goodFn: null },
        { label:"Fill Rate %", col:14, pct:true,  fmt:"pct",  up:true,  goodFn: v => v >= 0.7 },
      ];

      const vHeaderCells = VEH_DAILY_COLS.map(c => `<th>${c.label}</th>`).join("");
      const vBodyRows = vDailyDates.map((date, idx) => {
        const r = vRows.find(row => row[2] === date);
        const prevDate = idx > 0 ? vDailyDates[idx-1] : null;
        const prevR = prevDate ? vRows.find(row => row[2] === prevDate) : null;
        if (!r) return "";
        const cells = VEH_DAILY_COLS.map(c => {
          const v = parseNum(r[c.col]);
          const pv = prevR ? parseNum(prevR[c.col]) : null;
          let cls = "";
          if (v !== null && c.goodFn) cls = c.goodFn(v) ? "td-good" : "td-bad";
          let arrow = "";
          if (v !== null && pv !== null) {
            const vd = toDisplay(v, c.pct), pd = toDisplay(pv, c.pct);
            const diff = vd - pd;
            if (Math.abs(diff) > 0.001) {
              const improved = c.up ? diff > 0 : diff < 0;
              arrow = `<span style="font-size:10px;color:${improved?"#10b981":"#ef4444"};margin-left:3px;">${diff>0?"▲":"▼"}</span>`;
            }
          }
          let display;
          if (c.fmt==="int") display=fmtInt(v);
          else if (c.fmt==="dec1") display=fmtDec1(v);
          else if (c.fmt==="pct") display=fmt(v,true);
          else display=fmt(v,false);
          return `<td class="${cls}">${display}${arrow}</td>`;
        }).join("");
        return `<tr><td>${fmtDate(date)}</td>${cells}</tr>`;
      }).join("");

      const icon = vType === "Bike" ? "🏍️" : "🚲";
      mainContent = `
        <div class="section-label">📆 Daily Performance — ${icon} ${vType}</div>
        ${dailyVehicleTabs}
        <div class="history-table-wrap">
          <table class="history-table">
            <thead><tr><th>DATE</th>${vHeaderCells}</tr></thead>
            <tbody>${vBodyRows}</tbody>
          </table>
        </div>`;
    }
  }

  // ═══════════════════════════════════
  // TOP & BOTTOM
  // ═══════════════════════════════════
  else if (state.view === "topbottom") {
    const rows = validRows.filter(r => parseNum(r[8]) > 0);

    const TB_METRICS = [
      { label:"Run Rate %",     col:7,  pct:true,  bestHigh:true  },
      { label:"Orders",         col:8,  pct:false, bestHigh:true  },
      { label:"WH",             col:9,  pct:false, bestHigh:true  },
      { label:"UTR",            col:10, pct:false, bestHigh:false },
      { label:"TR Fail %",      col:12, pct:true,  bestHigh:false },
      { label:"DT",             col:13, pct:false, bestHigh:false },
      { label:"RAT",            col:14, pct:false, bestHigh:false },
      { label:"Order On Time %",col:16, pct:true,  bestHigh:true  },
      { label:"Idle Time %",    col:17, pct:true,  bestHigh:false },
      { label:"Active",         col:19, pct:false, bestHigh:true  },
      { label:"No Show %",      col:20, pct:true,  bestHigh:false },
      { label:"AVP %",          col:21, pct:true,  bestHigh:true  },
      { label:"AVG WH/Rider",   col:22, pct:false, bestHigh:true  },
      { label:"Fill Rate %",    col:23, pct:true,  bestHigh:true  },
      { label:"Late Login %",   col:24, pct:true,  bestHigh:false },
    ];

    function getBestWorst(rows, col, pct, bestHigh) {
      const valid = rows.map(r => ({ val: parseNum(r[col]), date: r[4] })).filter(x => x.val !== null);
      if (!valid.length) return { best: null, worst: null };
      valid.sort((a,b) => a.val - b.val);
      return {
        best:  bestHigh ? valid[valid.length-1] : valid[0],
        worst: bestHigh ? valid[0] : valid[valid.length-1],
      };
    }

    const tbCards = TB_METRICS.map(m => {
      const { best, worst } = getBestWorst(rows, m.col, m.pct, m.bestHigh);
      const bestDisplay  = best  ? (m.col===8||m.col===9||m.col===19 ? fmtInt(best.val)  : m.col===13||m.col===14||m.col===22 ? fmtDec1(best.val)  : fmt(best.val, m.pct))  : "—";
      const worstDisplay = worst ? (m.col===8||m.col===9||m.col===19 ? fmtInt(worst.val) : m.col===13||m.col===14||m.col===22 ? fmtDec1(worst.val) : fmt(worst.val, m.pct)) : "—";
      return `
      <div class="tb-card">
        <div class="tb-card-label">📊 ${m.label}</div>
        <div class="tb-row">
          <div>
            <div class="tb-row-label">🏆 Best Day</div>
            <div class="tb-row-date">${best ? fmtDate(best.date) : "—"}</div>
          </div>
          <div class="tb-row-val" style="color:var(--green)">${bestDisplay}</div>
        </div>
        <div class="tb-row">
          <div>
            <div class="tb-row-label">📉 Worst Day</div>
            <div class="tb-row-date">${worst ? fmtDate(worst.date) : "—"}</div>
          </div>
          <div class="tb-row-val" style="color:var(--red)">${worstDisplay}</div>
        </div>
      </div>`;
    }).join("");

    mainContent = `
      <div class="section-label">🏆 Top & Bottom Days — This Month</div>
      <div class="tb-grid">${tbCards}</div>`;
  }
  if (state.view === "glossary") {
    mainContent = `
      <div class="section-label">📖 KPI Definitions — المصطلحات</div>
      <input class="glossary-search" type="text" placeholder="🔍 ابحث عن أي مصطلح..." oninput="document.getElementById('glossary-grid').innerHTML=renderGlossary(this.value)" />
      <div class="glossary-grid" id="glossary-grid">${renderGlossary("")}</div>`;
  }

  document.getElementById("content").innerHTML = hero + viewTabs + mainContent;
}

function renderGlossary(filter) {
  const q = (filter || "").toLowerCase();
  const filtered = GLOSSARY.filter(g =>
    g.term.toLowerCase().includes(q) ||
    g.full.toLowerCase().includes(q) ||
    g.def.toLowerCase().includes(q)
  );
  const cards = filtered.map(g => `
    <div class="glossary-card">
      <div class="glossary-term">${g.term}</div>
      <div class="glossary-full">${g.full}</div>
      <div class="glossary-def">${g.def}</div>
      ${g.formula ? `<div class="glossary-formula">📐 ${g.formula}</div>` : ""}
    </div>`).join("");
  return cards || `<div class="loading" style="grid-column:1/-1">لا توجد نتائج</div>`;
}

function setZone(id) {
  state.zone = id;
  state.vehicle = id === "Hadayek" ? "Bike" : "all";
  render();
}
function setVehicle(v)  { state.vehicle = v; render(); }
function setView(v)     { state.view = v; state.vehicle = "all"; render(); }
